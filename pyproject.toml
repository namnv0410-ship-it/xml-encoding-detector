[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "xml-encoding-detector"
version = "0.1.0"
description = "Lightweight XML encoding detector for Python."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

authors = [
    { name = "namnv0410" }
]

dependencies = [
    "lxml>=5.0"
]

[project.optional-dependencies]

test = [
    "pytest>=8.0",
    "pytest-cov>=5.0"
]

dev = [
    "ruff>=0.7"
]

[project.urls]

Homepage = "https://github.com/namnv0410-ship-it/xml-encoding-detector"
Repository = "https://github.com/namnv0410-ship-it/xml-encoding-detector"
Issues = "https://github.com/namnv0410-ship-it/xml-encoding-detector/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]

testpaths = [
    "tests"
]

addopts = [
    "-ra",
    "-v",
    "--cov=xml_encoding_detector",
    "--cov-report=term-missing"
]

[tool.ruff]

line-length = 88

target-version = "py312"

src = [
    "src",
    "tests"
]

[tool.ruff.lint]

select = [
    "E",
    "F",
    "I",
    "B",
    "UP"
]

ignore = []